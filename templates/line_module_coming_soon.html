{% extends "base.html" %}
{% block title %}{{ module_name }} ({{ line|capitalize }}) - Delta Plus ERP{% endblock %}
{% block content %}
<div class="container">
    <h1>{{ module_name }} <span style="color:#666;font-size:0.9rem;">({{ line|capitalize }})</span></h1>
    <p style="color:#666;font-size:1.1rem;">This module is being set up. Full replication is in progress.</p>
    <div class="mt-4">
        <a href="{{ url_for(line ~ '_dashboard') }}" class="btn btn-primary">← Back to {{ line|capitalize }} Dashboard</a>
    </div>
</div>
{% endblock %}
