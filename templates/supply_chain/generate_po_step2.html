{% extends "base.html" %}

{% block title %}Generate Purchase Order - Step 2 - Delta Plus ERP{% endblock %}

{% block content %}
<div class="container">
    <h1>Generate Purchase Order: {{ po_number }}</h1>
    <p>Step 2 of 7: Select Demand Note</p>

    <div class="form-container mt-4" style="max-width: 600px; margin: 2rem auto;">
        <form method="POST" action="{{ url_for('supply_chain.generate_po_add_components') }}">
            <div class="form-group">
                <label for="demand_no" class="form-label required">Select Demand Note</label>
                <input type="text" id="demand_search" class="form-input" 
                       placeholder="🔍 Type to search demand numbers..." 
                       onkeyup="filterDemands()">
                <select id="demand_no" name="demand_no" class="form-input" required size="10" 
                        style="margin-top: 0.5rem; font-family: monospace;">
                    {% if demand_numbers %}
                        {% for num in demand_numbers %}
                        <option value="{{ num }}">Demand #{{ num }}</option>
                        {% endfor %}
                    {% else %}
                        <option value="">No approved demands available</option>
                    {% endif %}
                </select>
                <small style="color: #666; display: block; margin-top: 0.5rem;">
                    Type to filter, then click to select
                </small>
            </div>

            <div class="form-actions">
                <a href="{{ url_for('supply_chain.generate_po') }}" class="btn btn-secondary">← Back</a>
                <button type="submit" class="btn btn-primary" {% if not demand_numbers %}disabled{% endif %}>
                    Next →
                </button>
            </div>
        </form>
    </div>
</div>

<script>
function filterDemands() {
    const search = document.getElementById('demand_search').value.toLowerCase();
    const select = document.getElementById('demand_no');
    const options = select.options;
    
    for (let i = 0; i < options.length; i++) {
        const text = options[i].text.toLowerCase();
        if (text.includes(search)) {
            options[i].style.display = '';
        } else {
            options[i].style.display = 'none';
        }
    }
}

// Auto-select first visible option when search changes
document.getElementById('demand_search').addEventListener('input', function() {
    const select = document.getElementById('demand_no');
    for (let i = 0; i < select.options.length; i++) {
        if (select.options[i].style.display !== 'none') {
            select.selectedIndex = i;
            break;
        }
    }
});
</script>

<style>
    .form-container {
        background: white;
        padding: 2rem;
        border-radius: 8px;
        box-shadow: var(--shadow-md);
    }

    .form-actions {
        display: flex;
        justify-content: space-between;
        margin-top: 2rem;
        gap: 1rem;
    }

    select[size] {
        width: 100%;
        padding: 0.5rem;
    }

    select option {
        padding: 0.5rem;
        cursor: pointer;
    }

    select option:hover {
        background: var(--primary-color);
        color: white;
    }
</style>
{% endblock %}
