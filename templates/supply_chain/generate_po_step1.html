{% extends "base.html" %}

{% block title %}Generate Purchase Order - Step 1 - Delta Plus ERP{% endblock %}

{% block content %}
<div class="container">
    <h1>Generate Purchase Order</h1>
    <p>Step 1 of 7: Enter PO Number</p>

    <div class="form-container mt-4" style="max-width: 600px; margin: 2rem auto;">
        <form method="POST" action="{{ url_for('supply_chain.generate_po_select_demand') }}">
            <div class="form-group">
                <label for="po_number" class="form-label required">PO Number</label>
                <input type="text" id="po_number" name="po_number" class="form-input" 
                       required placeholder="e.g. PO-001, PO-123" 
                       pattern="PO-\d+" 
                       title="Format: PO-XXX (where XXX is a number)">
                <small style="color: #666; display: block; margin-top: 0.5rem;">
                    Format: PO-XXX (e.g. PO-228)
                </small>
            </div>

            <div class="form-actions">
                <a href="{{ url_for('supply_chain.supply_chain_dashboard') }}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Next →</button>
            </div>
        </form>
    </div>
</div>

<style>
    .form-container {
        background: white;
        padding: 2rem;
        border-radius: 8px;
        box-shadow: var(--shadow-md);
    }

    .form-actions {
        display: flex;
        justify-content: space-between;
        margin-top: 2rem;
        gap: 1rem;
    }
</style>
{% endblock %}
