{% extends "base.html" %}

{% block title %}Login - Delta Plus ERP{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-box">
        <h2>Delta Plus ERP</h2>
        <p class="text-center mb-3" style="color: #666;">Sign in to access your account</p>

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="email" class="form-label required">Email Address</label>
                <input type="email" id="email" name="email" class="form-input" required placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label for="password" class="form-label required">Password</label>
                <input type="password" id="password" name="password" class="form-input" required
                    placeholder="Enter your password">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">
                Sign In
            </button>
        </form>




    </div>
</div>
{% endblock %}
